services:
  postgres:
    image: postgres:16-alpine
    container_name: ratemyuj-postgres
    environment:
      POSTGRES_DB: ratemyuj
      POSTGRES_USER: ratemyuj
      POSTGRES_PASSWORD: ratemyuj
    ports:
      - "5432:5432"
    volumes:
      - ratemyuj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratemyuj -d ratemyuj"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ratemyuj-pgdata:
