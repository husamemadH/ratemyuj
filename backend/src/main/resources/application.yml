spring:
  application:
    name: ratemyuj
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ratemyuj}
    username: ${DB_USERNAME:ratemyuj}
    password: ${DB_PASSWORD:ratemyuj}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

openrouter:
  api-key: ${OPENROUTER_API_KEY}          # never commit this — env var only
  base-url: https://openrouter.ai
  decisions-path: /api/alpha/decisions     # Jev (TypeSafe) decision model endpoint
  model: ${MODERATION_MODEL:typesafe/jev-1.13}
  timeout-seconds: 12
  escalate-below-confidence: ${MODERATION_ESCALATE_BELOW_CONFIDENCE:0.6}
  category-threshold: ${MODERATION_CATEGORY_THRESHOLD:0.5}  # noul probability above which a policy category is flagged

app:
  hash-pepper: ${HASH_PEPPER}             # server-side secret for HMAC(email). Not the JWT secret.
  rate-limit:
    reviews-per-hour: ${REVIEWS_PER_HOUR:10}  # per student; 0 disables the cap
  admin:
    api-key: ${ADMIN_API_KEY:}            # required for /api/admin/**; empty disables the admin API
  auth:
    jwt-secret: ${JWT_SECRET}             # HS256 key, at least 32 bytes. Separate from HASH_PEPPER.
    jwt-ttl: ${JWT_TTL:7d}
    cookie-name: session
    cookie-secure: ${COOKIE_SECURE:true}  # http://localhost still stores Secure cookies
    mail-mode: ${MAIL_MODE:log}           # log prints the code; smtp sends it. Real deploys use smtp.
